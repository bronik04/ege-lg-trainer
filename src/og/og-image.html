<!DOCTYPE html>
<!--
  Исходник картинки превью ссылок (og-image.jpg, 1200×630) — облик «тетрадь», цвета светлой темы.
  Чисел здесь сознательно нет: картинка не должна устаревать при пополнении банка.
  Пересобрать: node scripts/render_og_image.mjs (нужны Google Chrome, npm ci и сеть для шрифтов).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500..800&amp;family=Golos+Text:wght@400..800&amp;display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
<style>
  :root {
    --paper: #F2F4EF; --sheet: #FBFCFA; --ink: #1C2230; --muted: #5D6672; --line: #DAE1DA;
    --grid: #86B59F; --guide: #BFD9CB; --cell-line: #5E977C; --pen: #2447A8; --red: #C23A2C;
    --seal-ink: #FFF6F2;
    --zh: "LXGW WenKai Screen", "Kaiti SC", STKaiti, KaiTi, serif;
    --ui: "Golos Text", system-ui, -apple-system, sans-serif;
    --disp: Alegreya, Georgia, serif;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: var(--ink); font-family: var(--ui);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 -1px / 30px 30px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) -1px 0 / 30px 30px,
      var(--paper);
  }
  /* Поле тетради — красная линия, как в школьной тетради. */
  body::before { content: ""; position: absolute; top: 0; bottom: 0; left: 88px; width: 2px; background: var(--red); opacity: .55; }
  .content { position: absolute; left: 132px; top: 92px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .seal {
    flex: none; width: 64px; height: 64px; border-radius: 8px; display: grid; place-items: center;
    background: var(--red); color: var(--seal-ink); font: 44px/1 var(--zh);
  }
  .eyebrow { white-space: nowrap; font-size: 24px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  h1 { margin: 40px 0 0; font: 800 88px/1 var(--disp); letter-spacing: -.01em; }
  .subtitle { margin-top: 26px; font-size: 32px; line-height: 1.3; }
  .note {
    margin-top: 56px; font-size: 27px; font-weight: 600; color: var(--pen);
    display: inline-block; padding-bottom: 6px; border-bottom: 3px solid var(--pen);
  }
  /* Клетки 田字格, как пропуск в задании: второй знак вписан синей ручкой и отмечен учителем. */
  .cells { position: absolute; right: 96px; top: 158px; display: flex; flex-direction: column; gap: 26px; }
  .cell {
    position: relative; width: 150px; height: 150px; box-sizing: border-box;
    border: 3px solid var(--cell-line); background: var(--sheet);
    display: grid; place-items: center; font: 112px/1 var(--zh);
  }
  .cell::before, .cell::after { content: ""; position: absolute; }
  .cell::before { left: 50%; top: 0; bottom: 0; border-left: 2px dashed var(--guide); }
  .cell::after { top: 50%; left: 0; right: 0; border-top: 2px dashed var(--guide); }
  .cell span { position: relative; z-index: 1; }
  .cell.pen { color: var(--pen); }
  .tick { position: absolute; right: -58px; bottom: 6px; font: 800 58px/1 var(--ui); color: var(--red); transform: rotate(-8deg); }
</style>
</head>
<body>
  <div class="content">
    <div class="brand">
      <div class="seal" lang="zh">语</div>
      <div class="eyebrow">ЕГЭ · КИТАЙСКИЙ ЯЗЫК · ЗАДАНИЯ 15–27</div>
    </div>
    <h1>Лексика<br>и грамматика</h1>
    <div class="subtitle">Правила, задания банка ФИПИ<br>и полный вариант с таймером</div>
    <div class="note">У каждого неверного варианта — свой разбор</div>
  </div>
  <div class="cells" lang="zh">
    <div class="cell"><span>语</span></div>
    <div class="cell pen"><span>法</span><div class="tick" lang="ru">✓</div></div>
  </div>
</body>
</html>
